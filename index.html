<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap');

:root{
  --paper:#14171F;
  --surface:#1B1F29;
  --ink:#ECE7DA;
  --ink-soft:#A7A9B4;
  --line:#2E3340;
  --line-strong:#3B4152;
  --accent:#E6A155;
  --accent-ink:#241407;
  --shadow: 0 2px 14px rgba(0,0,0,0.45);
  --radius: 6px;

  --cat-pelicula:#E2565F;
  --cat-serie:#B2434C;
  --cat-libro:#E8C468;
  --cat-comic:#E6A155;
  --cat-museo:#4E90C4;
  --cat-exposicion:#7EC1E0;
  --cat-musica:#5FA85C;
  --cat-juego:#8FC26C;

  --font-display:'Bebas Neue', 'Arial Narrow', sans-serif;
  --font-body:'Source Serif 4', Georgia, serif;
  --font-mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  min-height:100vh;
  overflow-x:hidden;
  transition:background .25s ease, color .25s ease;
}
button, input, select, textarea{font-family:inherit;}

/* ===== Top bar ===== */
.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 20px;
  background:var(--paper);
  border-bottom:1px solid var(--line);
}
.brand{
  display:flex; align-items:center; gap:10px;
}
.brand-icon{
  width:34px; height:34px; flex-shrink:0; display:block; border-radius:50%;
}
.brand-mark{
  font-family:var(--font-display);
  font-size:30px;
  letter-spacing:1px;
  color:var(--accent);
  line-height:1;
}
.brand-sub{
  font-family:var(--font-mono);
  font-size:10px;
  letter-spacing:2px;
  color:var(--ink-soft);
  text-transform:uppercase;
}
.topbar-actions{display:flex; align-items:center; gap:10px;}
.icon-btn{
  width:38px; height:38px;
  display:flex; align-items:center; justify-content:center;
  border-radius:50%;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink);
  cursor:pointer;
}
.icon-btn:hover{border-color:var(--line-strong);}
.icon-btn svg{width:18px; height:18px;}
.icon-btn{position:relative;}
.icon-btn.active-state{border-color:var(--accent); color:var(--accent);}
.icon-dropdown{position:relative; display:inline-block;}
.icon-dropdown-menu{
  display:none; position:absolute; top:100%; left:0; margin-top:6px; z-index:30;
  background:var(--surface); border:1px solid var(--line-strong); border-radius:8px;
  box-shadow:var(--shadow); min-width:170px; overflow:hidden;
}
.icon-dropdown-menu.open{display:block;}
.icon-dropdown-menu button{
  display:flex; align-items:center; gap:8px; width:100%; box-sizing:border-box;
  background:none; border:none; text-align:left; cursor:pointer;
  padding:10px 14px; font-family:var(--font-mono); font-size:12px; color:var(--ink);
  border-bottom:1px solid var(--line);
}
.icon-dropdown-menu button:last-child{border-bottom:none;}
.icon-dropdown-menu button:hover{background:var(--paper);}
.icon-dropdown-menu button svg{width:15px; height:15px; flex-shrink:0; color:var(--ink-soft);}
.filter-count{
  position:absolute; top:-4px; right:-4px;
  background:var(--accent); color:var(--accent-ink); border-radius:999px;
  font-family:var(--font-mono); font-size:9px; padding:1px 5px; line-height:1.5;
}

.add-btn{
  display:flex; align-items:center; gap:8px;
  background:var(--accent); color:var(--accent-ink);
  border:none; border-radius:999px;
  padding:10px 18px 10px 14px;
  font-family:var(--font-mono); font-size:12px; letter-spacing:1px; text-transform:uppercase;
  cursor:pointer;
  box-shadow:var(--shadow);
}
.add-btn:hover{filter:brightness(1.05);}
.add-btn svg{width:16px;height:16px;}

/* ===== Tabs ===== */
.tabs{
  display:flex; gap:4px;
  padding:10px 20px 0 20px;
  overflow-x:auto;
  border-bottom:1px solid var(--line);
  background:var(--paper);
  position:sticky; top:66px; z-index:35;
}
.tab{
  font-family:var(--font-mono);
  font-size:12px; letter-spacing:1px; text-transform:uppercase;
  padding:10px 16px;
  color:var(--ink-soft);
  background:none; border:none;
  border-bottom:2px solid transparent;
  cursor:pointer;
  white-space:nowrap;
}
.tab.active{color:var(--accent); border-bottom-color:var(--accent);}

/* ===== Filter bar ===== */
.filterbar{
  display:none; flex-direction:column; gap:14px;
  padding:14px 20px;
  max-width:1100px; margin:0 auto; box-sizing:border-box;
  border-bottom:1px dashed var(--line);
}
.filterbar.open{display:flex; align-items:center;}
.filter-dates-row{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:12px;}
.cat-tile-grid{
  display:flex; flex-wrap:wrap; justify-content:center; align-content:center; gap:5px;
  width:271px; margin:0 auto;
}
.cat-tile{
  flex:0 0 64px; width:64px; height:74px; box-sizing:border-box;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
  border:1px solid var(--line-strong); border-radius:10px; background:var(--surface);
  padding:6px 4px; cursor:pointer; user-select:none;
}
.filter-bottom-row{display:flex; align-items:stretch; justify-content:center; gap:8px;}
.filter-total-box, .clear-filters{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-family:var(--font-mono);
  border:1px solid var(--line-strong); border-radius:4px;
  padding:6px 8px; cursor:default; box-sizing:border-box;
}
.filter-total-box{color:var(--ink-soft); text-align:center; line-height:1.35;}
.filter-total-box b{font-size:16px; color:var(--ink); font-family:var(--font-display); letter-spacing:.5px; font-weight:600;}
.filter-total-box span{font-size:8.5px; text-transform:uppercase; letter-spacing:1px;}
@media (min-width:768px){
  .filterbar.open{
    display:grid;
    grid-template-columns:328px 1fr auto auto;
    grid-template-rows:auto auto;
    align-items:center;
    column-gap:10px; row-gap:10px;
  }
  .filterbar .filter-title-row{grid-column:1; grid-row:1; justify-content:flex-start;}
  .filterbar .filter-title-row input{max-width:none; width:328px;}
  .filterbar .filter-dates-row{grid-column:1; grid-row:2; justify-content:flex-start; width:100%;}
  .filterbar .filter-dates{width:328px;}
  .filterbar .cat-tile-grid{
    grid-column:2; grid-row:1 / span 2; align-items:center; align-content:center;
    justify-content:center; gap:5px;
    max-width:none; width:auto; height:auto; min-height:76px; margin:0 auto;
  }
  .filterbar .cat-tile-grid .cat-tile{height:76px; flex:0 0 62px; width:62px;}
  .filterbar .filter-bottom-row{display:contents;}
  .filterbar .filter-total-box{
    grid-column:3; grid-row:1 / span 2; justify-self:center;
    width:64px; height:76px;
  }
  .filterbar .clear-filters{
    grid-column:4; grid-row:1 / span 2; justify-self:end;
    width:64px; height:76px; line-height:1.4; text-align:center;
  }
}
.cat-tile .ic{
  width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:color-mix(in srgb, var(--c,var(--accent)) 20%, var(--surface)); color:var(--c,var(--accent));
}
.cat-tile .ic svg{width:17px; height:17px;}
.cat-tile span{
  font-family:var(--font-mono); font-size:10px; color:var(--ink-soft); text-align:center;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;
}
.cat-tile.active{border-color:var(--c,var(--accent));}
.cat-tile.active .ic{background:var(--c,var(--accent)); color:var(--accent-ink);}
.cat-tile.active span{color:var(--ink);}
.filter-title-row{display:flex; align-items:center; justify-content:center;}
.filter-title-row input{
  width:271px; box-sizing:border-box; height:36px;
  border:1px solid var(--line-strong); background:var(--surface); color:var(--ink);
  border-radius:6px; padding:0 12px; font-family:var(--font-mono); font-size:12px;
}
.filter-dates{
  display:flex; align-items:center; gap:6px;
  font-family:var(--font-mono); font-size:11px; color:var(--ink-soft);
}
.filter-dates input[type=date]{
  box-sizing:border-box; height:30px; width:116px;
  border:1px solid var(--line-strong);
  background:var(--surface); color:var(--ink);
  border-radius:4px; padding:0 8px; font-size:11px; font-family:var(--font-mono);
}
.clear-filters{
  font-size:11px; background:none; color:var(--ink-soft); cursor:pointer;
}
.clear-filters span{display:block;}
.clear-filters:hover{color:var(--accent); border-color:var(--accent);}

.view-wrap{padding:20px; max-width:1100px; margin:0 auto;}

/* ===== Ticket stub card (Lista) ===== */
.list-view{display:flex; flex-direction:column; gap:12px;}
.entry-card{
  display:flex;
  height:92px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
  position:relative;
  cursor:pointer;
}
.entry-card:hover{border-color:var(--line-strong);}
.stub{
  width:76px; flex-shrink:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:6px;
  padding:8px;
  background:color-mix(in srgb, var(--cat, var(--accent)) 12%, var(--surface));
  border-right:1px dashed var(--line-strong);
  position:relative;
}
.stub::before, .stub::after{
  content:""; position:absolute; left:100%; transform:translateX(-50%);
  width:16px; height:16px; border-radius:50%;
  background:var(--paper);
  border:1px solid var(--line);
}
.stub::before{top:-8px;}
.stub::after{bottom:-8px;}
.stub-date{
  font-family:var(--font-mono); font-size:10px; text-align:center; color:var(--ink-soft); line-height:1.3;
}
.stub-date b{display:block; font-size:17px; color:var(--ink); font-family:var(--font-display); letter-spacing:1px;}
.stub-icon{width:22px; height:22px; color:var(--cat, var(--accent));}
.entry-main{
  flex:1; display:flex; align-items:stretch; min-width:0;
}
.entry-thumb{
  display:block;
  align-self:stretch; width:92px; height:100%; min-height:0; min-width:0; object-fit:contain; object-position:center;
  flex-shrink:0; background:var(--surface);
}
.entry-body{
  flex:1; min-width:0; padding:10px 16px;
  display:flex; flex-direction:column; justify-content:center; overflow:hidden;
}
.entry-cat{
  font-family:var(--font-mono); font-size:10px; letter-spacing:1.5px; text-transform:uppercase;
  color:var(--cat, var(--accent));
}
.entry-title{
  font-family:var(--font-body); font-weight:700; font-size:16px; margin:2px 0 3px 0;
  color:var(--ink);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.entry-notes{
  font-size:12px; color:var(--ink-soft); line-height:1.4;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}

.empty-state{
  text-align:center; padding:70px 20px; color:var(--ink-soft);
}
.empty-state .stamp{
  font-family:var(--font-display); font-size:26px; color:var(--line-strong); letter-spacing:2px;
  border:2px dashed var(--line-strong); display:inline-block; padding:10px 24px; border-radius:8px;
  transform:rotate(-3deg); margin-bottom:14px;
}

/* ===== Calendar view ===== */
.cal-header{
  display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:16px;
}
.cal-header .month-label{
  font-family:var(--font-display); font-size:26px; letter-spacing:1px; min-width:220px; text-align:center;
}
.cal-nav{
  background:var(--surface); border:1px solid var(--line-strong); border-radius:50%;
  width:34px; height:34px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink);
}
.cal-nav:hover{border-color:var(--accent); color:var(--accent);}
.cal-grid{
  display:grid; grid-template-columns:repeat(7,1fr); gap:6px;
}
.cal-dow{
  font-family:var(--font-mono); font-size:10px; text-align:center; color:var(--ink-soft); letter-spacing:1px; padding-bottom:6px;
}
.cal-day{
  min-height:88px;
  border:1px solid var(--line);
  border-radius:4px;
  background:var(--surface);
  padding:6px;
  display:flex; flex-direction:column; gap:4px;
  cursor:pointer;
}
.cal-day.empty{background:transparent; border:none; cursor:default;}
.cal-day.today{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset;}
.cal-day-num{font-family:var(--font-mono); font-size:11px; color:var(--ink-soft);}
.cal-icons{display:flex; flex-wrap:wrap; gap:4px;}
.cal-icons .cal-icon{
  width:13px; height:13px; color:var(--c, var(--accent)); display:flex;
}
.cal-icons .cal-icon svg{width:100%; height:100%; display:block;}
.cal-more{font-family:var(--font-mono); font-size:9px; color:var(--ink-soft);}

/* ===== Mosaic view ===== */
.mosaic-day{margin-bottom:30px;}
.mosaic-day-label{
  font-family:var(--font-mono); font-size:11px; letter-spacing:1.5px; text-transform:uppercase;
  color:var(--ink-soft); margin-bottom:10px;
  display:flex; align-items:center; gap:10px;
}
.mosaic-day-label::after{content:""; flex:1; border-bottom:1px dashed var(--line-strong);}
.mosaic-grid{
  column-width:96px; column-gap:8px;
}
.mosaic-tile{
  position:relative; background:var(--surface); border:1px solid var(--line); border-radius:4px;
  padding:5px 5px 8px 5px; box-shadow:var(--shadow); cursor:pointer;
  break-inside:avoid; margin-bottom:8px; display:inline-block; width:100%;
}
.mosaic-tile img{
  width:100%; height:auto; display:block; border-radius:2px; background:var(--paper);
}
.mosaic-tile .noimg{
  width:100%; height:72px; border-radius:2px; background:var(--paper);
  display:flex; align-items:center; justify-content:center; color:var(--cat, var(--accent));
}
.mosaic-tile .noimg svg{width:22px; height:22px;}
.mosaic-meta{
  display:flex; align-items:center; gap:4px; margin-top:5px;
}
.mosaic-cat-icon{
  width:12px; height:12px; flex-shrink:0; color:var(--cat, var(--accent));
}
.mosaic-cat-icon svg{display:block; width:100%; height:100%;}
.mosaic-title{
  font-size:10px; font-weight:600; color:var(--ink);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

/* ===== Stats view ===== */
.stats-controls{
  display:flex; align-items:center; gap:10px; margin-bottom:24px; flex-wrap:wrap;
}
.stats-period-row{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
}
.seg{
  display:flex; border:1px solid var(--line-strong); border-radius:999px; overflow:hidden;
}
.seg button{
  border:none; background:var(--surface); color:var(--ink-soft);
  font-family:var(--font-mono); font-size:11px; letter-spacing:1px; text-transform:uppercase;
  padding:8px 16px; cursor:pointer;
}
.seg button.active{background:var(--accent); color:var(--accent-ink);}
.stats-select{
  border:1px solid var(--line-strong); background:var(--surface); color:var(--ink);
  border-radius:4px; padding:8px 10px; font-family:var(--font-mono); font-size:12px;
}
.stats-total{
  font-family:var(--font-mono); font-size:11px; color:var(--ink-soft); margin-left:auto;
}
@media (max-width:640px){
  .stats-controls{flex-direction:column; align-items:stretch;}
  .seg{display:grid; grid-template-columns:repeat(3, 1fr);}
  .seg button{padding:8px 4px; font-size:9.5px; letter-spacing:.5px; text-align:center;}
  .stats-period-row{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; width:100%;
  }
  .stats-select{width:100%; box-sizing:border-box;}
  .stats-total{grid-column:1 / -1; margin-left:0; text-align:center;}
}
.bar-row{display:flex; align-items:center; gap:12px; margin-bottom:12px;}
.bar-label{
  width:110px; flex-shrink:0; font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.5px;
  color:var(--ink-soft); display:flex; align-items:center; gap:8px;
}
.bar-label svg{width:14px; height:14px; color:var(--c, var(--accent));}
.bar-track{
  flex:1; background:var(--line); height:10px; border-radius:999px; overflow:hidden;
}
.bar-fill{height:100%; background:var(--c, var(--accent)); border-radius:999px; transition:width .4s ease;}
.bar-count{font-family:var(--font-mono); font-size:12px; width:26px; text-align:right; color:var(--ink);}

.month-breakdown{margin-top:36px;}
.empty-hint{font-family:var(--font-mono); font-size:12px; color:var(--ink-soft); text-align:center; padding:24px 0;}
.history-chart{margin-top:8px;}
.history-svg{width:100%; height:auto; display:block;}
.history-legend{display:flex; flex-wrap:wrap; gap:10px 14px; margin-top:12px; justify-content:center;}
.history-legend-item{
  display:flex; align-items:center; gap:4px;
  font-family:var(--font-mono); font-size:10px; color:var(--ink-soft);
}
.history-legend-item svg{width:12px; height:12px; color:var(--c, var(--accent));}
.section-title{
  font-family:var(--font-display); font-size:20px; letter-spacing:1px; margin-bottom:14px;
}
.mb-row{
  display:grid; grid-template-columns:38px 1fr 26px; align-items:center; gap:8px; margin-bottom:8px;
}
.mb-label{font-family:var(--font-mono); font-size:11px; color:var(--ink-soft); text-transform:uppercase;}
.mb-stack{display:flex; height:20px; border-radius:4px; overflow:hidden; background:var(--line);}
.mb-seg{
  height:100%; display:flex; align-items:center; justify-content:center; gap:3px; overflow:hidden;
  color:#100b02; font-family:var(--font-mono); font-size:10px; font-weight:600; line-height:1;
  text-shadow:0 1px 0 rgba(255,255,255,.35);
}
.mb-total{font-family:var(--font-mono); font-size:11px; text-align:right; color:var(--ink);}

/* ===== Modal ===== */
.modal-overlay{
  position:fixed; inset:0; background:rgba(20,23,31,0.55);
  display:none; align-items:center; justify-content:center; z-index:100; padding:20px;
}
.modal-overlay.open{display:flex;}
.modal{
  background:var(--surface); border-radius:10px; width:100%; max-width:480px;
  max-height:90vh; overflow-y:auto; padding:26px; box-shadow:var(--shadow);
  border:1px solid var(--line);
}
.modal h2{font-family:var(--font-display); font-size:24px; letter-spacing:1px; margin:0 0 18px 0;}
.field{margin-bottom:16px;}
.field label{
  display:block; font-family:var(--font-mono); font-size:10px; letter-spacing:1.5px; text-transform:uppercase;
  color:var(--ink-soft); margin-bottom:6px;
}
.field input[type=text], .field input[type=date], .field textarea, .field select{
  width:100%; border:1px solid var(--line-strong); background:var(--paper); color:var(--ink);
  border-radius:5px; padding:10px 12px; font-size:14px; font-family:var(--font-body);
}
.field textarea{min-height:80px; resize:vertical;}
.title-suggestions{
  display:none; position:absolute; left:0; right:0; top:100%; margin-top:4px; z-index:20;
  background:var(--surface); border:1px solid var(--line-strong); border-radius:8px;
  box-shadow:var(--shadow); max-height:220px; overflow-y:auto;
}
.title-suggestion{
  display:flex; align-items:center; gap:8px; padding:9px 12px; cursor:pointer;
  border-bottom:1px solid var(--line);
}
.title-suggestion:last-child{border-bottom:none;}
.title-suggestion:hover{background:var(--paper);}
.ts-icon{width:16px; height:16px; flex-shrink:0; color:var(--c, var(--accent));}
.ts-icon svg{display:block; width:100%; height:100%;}
.ts-title{font-size:13px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.img-drop{
  border:1px dashed var(--line-strong); border-radius:6px; padding:14px; text-align:center;
  color:var(--ink-soft); font-size:12px; cursor:pointer; position:relative;
}
.img-url-hint{font-size:11px; color:var(--ink-soft); margin-top:8px; font-family:var(--font-mono); line-height:1.5; text-align:center;}
.img-url-hint a{color:var(--ink-soft); text-decoration:underline; cursor:pointer;}
.img-url-hint a:hover{color:var(--accent);}
.img-btn-row{display:flex; gap:8px;}
.img-icon-btn{
  flex:1; display:flex; align-items:center; justify-content:center; gap:7px;
  font-family:var(--font-mono); font-size:11px; letter-spacing:.5px; text-transform:uppercase;
  padding:10px 8px; border-radius:6px; border:1px solid var(--line-strong);
  background:var(--surface); color:var(--ink); cursor:pointer; text-decoration:none;
}
.img-icon-btn:hover{border-color:var(--accent); color:var(--accent);}
.img-icon-btn svg{width:15px; height:15px; flex-shrink:0;}
.img-paste-zone{
  margin-top:10px; border:1px dashed var(--line-strong); border-radius:6px;
  padding:20px 14px; text-align:center; color:var(--ink-soft); font-size:12px; line-height:1.6;
  outline:none; cursor:text;
}
.img-paste-zone:focus{border-color:var(--accent);}
.img-paste-zone small{color:var(--ink-soft); font-size:10px;}
.img-paste-zone b{color:var(--ink);}
.img-preview{width:100%; max-height:220px; object-fit:contain; border-radius:5px; margin-top:10px; background:var(--paper);}
.remove-img{
  font-family:var(--font-mono); font-size:10px; color:var(--accent); background:none; border:none; cursor:pointer; margin-top:6px;
}
.modal-actions{display:flex; gap:8px; margin-top:20px;}
.btn{
  font-family:var(--font-mono); font-size:12px; letter-spacing:1px; text-transform:uppercase;
  padding:10px 16px; border-radius:6px; cursor:pointer; border:1px solid var(--line-strong);
  background:var(--surface); color:var(--ink); white-space:nowrap;
}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent;}
.btn.danger{color:#fff; background:var(--cat-pelicula); border-color:transparent;}

@media (max-width:640px){
  .topbar{padding:12px 14px;}
  .brand{gap:6px;}
  .brand-icon{width:24px; height:24px;}
  .brand-mark{font-size:24px;}
  .topbar-actions{gap:6px;}
  .icon-btn{width:34px; height:34px;}
  .icon-btn svg{width:16px; height:16px;}
  .add-btn{padding:10px; border-radius:50%;}
  .add-btn-text{display:none;}
  .view-wrap{padding:14px;}
  .filterbar{padding:12px 14px;}
  .entry-card{height:80px;}
  .stub{width:62px; padding:6px;}
  .entry-thumb{width:76px;}
  .cal-day{min-height:64px;}
  .modal{padding:18px;}
  .modal-actions{gap:6px;}
  .modal-actions .btn{flex:1 1 0; min-width:0; padding:10px 6px; font-size:10px; letter-spacing:.5px;}
}
</style>
</head>

<script>
(function(){
"use strict";

/* ---------- Categorías e iconos ---------- */
const ICONS = {
  pelicula: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 8h18M3 16h18M8 4v4M8 16v4M16 4v4M16 16v4"/></svg>',
  serie: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="12" rx="1.5"/><path d="M8 21h8M12 17v4"/></svg>',
  libro: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H12v16H5.5A1.5 1.5 0 0 1 4 18.5v-13z"/><path d="M20 5.5c0-.8-.7-1.5-1.5-1.5H12v16h6.5a1.5 1.5 0 0 0 1.5-1.5v-13z"/></svg>',
  comic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h13a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-4 3v-3H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="M7 9h9M7 13h5"/></svg>',
  museo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10l9-6 9 6"/><path d="M5 10v9M9 10v9M15 10v9M19 10v9M3 19h18"/></svg>',
  exposicion: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="14" rx="1"/><path d="M4 18l5-6 3 3 4-5 4 8"/></svg>',
  musica: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
  juego: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="8" width="20" height="9" rx="4"/><path d="M7 10.5v4M5 12.5h4"/><circle cx="16" cy="11" r="1"/><circle cx="18.5" cy="13.5" r="1"/></svg>'
};
const CATEGORIES = {
  pelicula:{label:'Película'}, serie:{label:'Serie'}, libro:{label:'Libro'},
  comic:{label:'Cómic'}, museo:{label:'Museo'}, exposicion:{label:'Expo'}, musica:{label:'Música'}, juego:{label:'Juego'}
};
const CAT_KEYS = Object.keys(CATEGORIES);
const MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MONTHS_SHORT = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const DOW = ['Lu','Ma','Mi','Ju','Vi','Sá','Do'];

/* ---------- Estado y almacenamiento ---------- */
const STORAGE_KEY = 'bitacora_entries_v1';
let entries = [];
try{ entries = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }catch(e){ entries = []; }
// Migración al nuevo modelo de sincronización por entrada: las entradas antiguas
// no tienen updatedAt/synced. Se marcan como "no sincronizadas" para que se
// vuelvan a subir de forma segura (nunca se pierden datos por la migración).
let _needsMigrationSave = false;
entries.forEach(e=>{
  if(!e.updatedAt){ e.updatedAt = new Date().toISOString(); e.synced = false; _needsMigrationSave = true; }
});
if(_needsMigrationSave){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); }catch(e){} }

/* ---------- Sincronización (Firestore) ----------
   Antes todo el diario se guardaba en UN solo documento de Firestore, que
   tiene un límite de tamaño de ~1 MiB. Un diario con varias imágenes lo
   supera tarde o temprano y entonces deja de sincronizar por completo.
   Ahora cada entrada se guarda en su PROPIO documento dentro de una
   subcolección (diarios/{código}/entries/{id}), así que el límite es por
   entrada (de sobra) y no por el diario entero: el diario puede crecer todo
   lo que haga falta.
   Dentro de cada documento de entrada, el contenido se trocea igual que
   antes en varios campos (d0, d1, d2...) de <1500 bytes cada uno, porque
   Firestore rechaza cualquier campo indexado de más de 1500 bytes.
   IMPORTANTE: para que esto funcione hace falta ampliar las reglas de
   Firestore una sola vez (ver aviso al final de esta respuesta).
------------------------------------------------------------------ */
const FIREBASE_PROJECT_ID = 'hyggelog-95ccf';
const FIRESTORE_BASE = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/databases/(default)/documents/diarios`;
const SYNC_CODE_KEY = 'bitacora_sync_code';
const LAST_SYNC_KEY = 'bitacora_last_sync_at';
const MARKER_KEY = 'bitacora_last_marker';
const CHUNK_BYTES = 1400; // margen de seguridad bajo el límite de 1500 bytes indexados de Firestore
const MAX_ENTRY_BYTES = 950000; // margen bajo el límite de ~1 MiB por documento (por entrada, no por diario)

function docUrl(code){ return `${FIRESTORE_BASE}/${encodeURIComponent(code)}`; }
function entriesUrl(code){ return `${docUrl(code)}/entries`; }
function entryUrl(code, id){ return `${entriesUrl(code)}/${encodeURIComponent(id)}`; }
function setSyncStatus(msg, isError){
  const el = document.getElementById('syncStatus');
  if(el) el.textContent = msg;
  const dot = document.getElementById('syncErrorDot');
  if(dot) dot.style.display = isError ? 'inline-block' : 'none';
}
function utf8Bytes(str){ return new TextEncoder().encode(str).length; }
function chunkStringByBytes(str, maxBytes){
  const chunks = [];
  let current = '', currentBytes = 0;
  for(const ch of str){ // for..of recorre por punto de código, no rompe pares subrogados
    const b = utf8Bytes(ch);
    if(currentBytes + b > maxBytes && current){ chunks.push(current); current=''; currentBytes=0; }
    current += ch; currentBytes += b;
  }
  chunks.push(current);
  return chunks;
}
async function firestoreErrorDetail(res){
  try{ const j = await res.json(); return j && j.error && j.error.message ? ': ' + j.error.message : ''; }
  catch(e){ return ''; }
}
function entryPayloadFields(entry){
  const payload = JSON.stringify({
    title:entry.title, notes:entry.notes, date:entry.date, category:entry.category,
    image:entry.image, createdAt:entry.createdAt
  });
  const bytes = utf8Bytes(payload);
  if(bytes > MAX_ENTRY_BYTES) return {tooBig:true, bytes};
  const chunks = chunkStringByBytes(payload, CHUNK_BYTES);
  const fields = {
    updatedAt: { timestampValue: entry.updatedAt },
    chunkCount: { integerValue: String(chunks.length) }
  };
  chunks.forEach((c,i)=>{ fields['d'+i] = { stringValue: c }; });
  return {fields};
}
function fieldsToEntryData(f){
  const updatedAt = f.updatedAt && f.updatedAt.timestampValue;
  let raw = null;
  if(f.chunkCount){
    const n = parseInt((f.chunkCount.integerValue!=null ? f.chunkCount.integerValue : f.chunkCount.doubleValue) || '0', 10);
    const parts = [];
    for(let i=0;i<n;i++){ parts.push((f['d'+i] && f['d'+i].stringValue) || ''); }
    raw = parts.join('');
  }
  if(!raw) return null;
  try{ return {...JSON.parse(raw), updatedAt}; }catch(e){ return null; }
}

async function pushEntryToCloud(entry){
  const code = localStorage.getItem(SYNC_CODE_KEY);
  if(!code) return {ok:false};
  const built = entryPayloadFields(entry);
  if(built.tooBig){
    setSyncStatus('«' + entry.title + '» ocupa demasiado (~' + Math.round(built.bytes/1024) + ' KB) para sincronizarse. Usa una imagen más ligera.', true);
    return {ok:false};
  }
  try{
    const res = await fetch(entryUrl(code, entry.id), { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({fields: built.fields}) });
    if(res.ok){
      entry.synced = true;
      setSyncStatus('Sincronizado ✓ ' + new Date().toLocaleTimeString());
      return {ok:true};
    } else {
      const detail = await firestoreErrorDetail(res);
      setSyncStatus('No se pudo sincronizar «' + entry.title + '» (código ' + res.status + ')' + detail, true);
      return {ok:false};
    }
  }catch(e){
    setSyncStatus('Sin conexión: se ha guardado solo en este dispositivo.', true);
    return {ok:false};
  }
}
async function deleteEntryFromCloud(id){
  const code = localStorage.getItem(SYNC_CODE_KEY);
  if(!code) return {ok:true};
  try{
    const res = await fetch(entryUrl(code, id), { method:'DELETE' });
    if(res.ok || res.status===404) return {ok:true};
    const detail = await firestoreErrorDetail(res);
    setSyncStatus('No se pudo borrar en la nube (código ' + res.status + ')' + detail, true);
    return {ok:false};
  }catch(e){
    setSyncStatus('Sin conexión: se ha borrado solo en este dispositivo.', true);
    return {ok:false};
  }
}
async function pushAllLocalEntries(){
  for(const entry of entries){ await pushEntryToCloud(entry); }
}

/* ---------- Marcador ligero de "última modificación" ----------
   Antes, cada comprobación automática (cada 15s) volvía a listar TODAS las
   entradas del diario para ver si algo había cambiado. Con más de 1500
   entradas eso agota en minutos la cuota gratuita diaria de lecturas de
   Firestore (código 429 "Quota exceeded"), y entonces deja de sincronizar
   en TODOS los dispositivos, no solo en el que lo detecta.
   Ahora, cada vez que se sube o borra una entrada, se anota la hora en un
   único campo "lastModified" del documento padre del diario (1 escritura
   barata). Las comprobaciones automáticas solo leen ESE campo (1 lectura
   barata) y comparan con el último valor visto en este dispositivo; el
   listado completo (caro) solo se hace cuando ese marcador ha cambiado de
   verdad, o cuando el usuario pide expresamente "Actualizar". */
async function touchDiaryMarker(code){
  try{
    await fetch(docUrl(code) + '?updateMask.fieldPaths=lastModified', {
      method:'PATCH', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({fields:{lastModified:{timestampValue:new Date().toISOString()}}})
    });
  }catch(e){ /* si falla, no pasa nada grave: los datos ya están guardados,
                solo tardarán un poco más en avisar a los demás dispositivos */ }
}
async function readDiaryMarker(code){
  try{
    const res = await fetch(docUrl(code) + '?mask.fieldPaths=lastModified');
    if(res.status===404) return {ok:true, marker:null};
    if(!res.ok) return {ok:false};
    const json = await res.json();
    const marker = (json.fields && json.fields.lastModified && json.fields.lastModified.timestampValue) || null;
    return {ok:true, marker};
  }catch(e){
    return {ok:false};
  }
}
async function refreshLocalMarker(code){
  const r = await readDiaryMarker(code);
  if(r.ok) localStorage.setItem(MARKER_KEY, r.marker || '');
}

async function listAllCloudEntries(code){
  const all = [];
  let pageToken = null;
  try{
    do{
      const url = entriesUrl(code) + '?pageSize=300' + (pageToken ? ('&pageToken=' + encodeURIComponent(pageToken)) : '');
      const res = await fetch(url);
      if(res.status===404) return {ok:true, docs:[]};
      if(!res.ok){
        const detail = await firestoreErrorDetail(res);
        return {ok:false, error:'http ' + res.status + detail};
      }
      const json = await res.json();
      (json.documents||[]).forEach(doc=>{
        const id = doc.name.split('/').pop();
        const data = fieldsToEntryData(doc.fields || {});
        if(data) all.push({id, ...data});
      });
      pageToken = json.nextPageToken || null;
    } while(pageToken);
    return {ok:true, docs:all};
  }catch(e){
    return {ok:false, error:String(e)};
  }
}
async function connectSync(code){
  code = code.trim();
  if(!code){ setSyncStatus('Escribe un código.'); return; }
  setSyncStatus('Conectando…');
  const result = await listAllCloudEntries(code);
  if(!result.ok){ setSyncStatus('No se pudo conectar. Comprueba tu conexión (o que las reglas de Firestore están actualizadas).', true); return; }
  localStorage.setItem(SYNC_CODE_KEY, code);
  if(result.docs.length){
    if(confirm('Se han encontrado ' + result.docs.length + ' entradas guardadas con este código. ¿Cargarlas en este dispositivo? (Sustituirá lo que tengas aquí)')){
      entries = result.docs.map(d=>({...d, synced:true}));
      saveEntries();
      renderFilterbar(); renderView();
      setSyncStatus('Conectado ✓');
    } else {
      await pushAllLocalEntries();
      await touchDiaryMarker(code);
      saveEntries();
      setSyncStatus('Conectado ✓ (se ha mantenido lo que tenías aquí)');
    }
  } else {
    await pushAllLocalEntries();
    await touchDiaryMarker(code);
    saveEntries();
    setSyncStatus('Conectado ✓ (código nuevo, se ha subido lo que tenías aquí)');
  }
  await refreshLocalMarker(code);
  startSyncPolling();
}

/* ---------- Reconciliación (usada al abrir, al pulsar Actualizar, y en la comprobación automática) ----------
   Fusiona entrada por entrada comparando su updatedAt: la versión más
   reciente (local o de la nube) gana. Una entrada local que nunca se llegó
   a subir (synced=false, p.ej. se creó sin conexión) siempre se sube en vez
   de asumir que fue borrada en otro dispositivo; solo se borra localmente
   una entrada que SÍ estaba sincronizada y ha desaparecido de la nube. */
async function reconcileWithCloud(opts){
  opts = opts || {};
  const code = localStorage.getItem(SYNC_CODE_KEY);
  if(!code) return;
  const result = await listAllCloudEntries(code);
  if(!result.ok){
    setSyncStatus(opts.silent ? 'Error de conexión en la última comprobación automática.' : 'No se pudo conectar. Comprueba tu conexión.', true);
    return;
  }
  const remoteById = {};
  result.docs.forEach(d=>{ remoteById[d.id] = d; });
  const localIds = new Set(entries.map(e=>e.id));
  const toPush = [];
  let changed = false;

  entries = entries.filter(local=>{
    const remote = remoteById[local.id];
    if(!remote){
      if(local.synced){ changed = true; return false; } // se borró en otro dispositivo
      toPush.push(local); // nunca se llegó a subir: se reintenta
      return true;
    }
    const localUpdated = local.updatedAt || '1970-01-01T00:00:00.000Z';
    const remoteUpdated = remote.updatedAt || '1970-01-01T00:00:00.000Z';
    if(remoteUpdated > localUpdated){
      Object.assign(local, remote, {synced:true});
      changed = true;
    } else if(localUpdated > remoteUpdated){
      toPush.push(local);
    }
    return true;
  });
  result.docs.forEach(remote=>{
    if(!localIds.has(remote.id)){
      entries.push({...remote, synced:true});
      changed = true;
    }
  });

  for(const entry of toPush){ await pushEntryToCloud(entry); }
  if(toPush.length) await touchDiaryMarker(code);
  if(changed) saveEntries();
  if(changed || toPush.length){
    renderFilterbar(); renderView();
    setSyncStatus('Actualizado ✓ ' + new Date().toLocaleTimeString());
  } else if(!opts.silent){
    setSyncStatus('Ya tienes la versión más reciente.');
  }
  localStorage.setItem(LAST_SYNC_KEY, new Date().toISOString());
  await refreshLocalMarker(code);
}
async function manualPull(){
  const code = localStorage.getItem(SYNC_CODE_KEY);
  if(!code){ setSyncStatus('Conecta primero un código.'); return; }
  setSyncStatus('Actualizando…');
  await reconcileWithCloud({});
}

/* ---------- Comprobación automática en segundo plano ---------- */
const SYNC_POLL_MS = 15000;
let syncPollTimer = null;
async function silentPull(){
  const code = localStorage.getItem(SYNC_CODE_KEY);
  if(!code) return;
  // No interrumpir si hay algo abierto (evita perder una edición en curso)
  if(overlay.classList.contains('open') || syncOverlay.classList.contains('open')) return;
  const check = await readDiaryMarker(code);
  if(!check.ok) return; // sin conexión: no forzamos nada, se reintentará en el siguiente ciclo
  const localMarker = localStorage.getItem(MARKER_KEY);
  if(localMarker === null || (check.marker || '') !== localMarker){
    await reconcileWithCloud({silent:true});
  }
}
function startSyncPolling(){
  if(syncPollTimer) return;
  syncPollTimer = setInterval(silentPull, SYNC_POLL_MS);
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible') silentPull();
});

function saveEntries(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); }
  catch(e){ alert('No se pudo guardar: el almacenamiento del navegador está lleno. Intenta con imágenes más ligeras.'); }
}

let state = {
  view:'calendario',
  filterCats:new Set(),
  filterFrom:'', filterTo:'', filterTitle:'', filterOpen:false, calendarDrillDate:null,
  calYear:new Date().getFullYear(), calMonth:new Date().getMonth(),
  listYear:new Date().getFullYear(), listMonth:new Date().getMonth(),
  statsMode:'mes', statsYear:new Date().getFullYear(), statsMonth:new Date().getMonth(),
  editingId:null, tempImage:null
};

/* ---------- Tema ---------- */
/* ---------- Utilidades ---------- */
function fmtDate(d){ // d = 'YYYY-MM-DD'
  const [y,m,day] = d.split('-').map(Number);
  return {y, m:m-1, day, obj:new Date(y, m-1, day)};
}
function todayStr(){
  const t = new Date();
  return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
}
function uid(){ return 'e'+Date.now()+Math.random().toString(36).slice(2,7); }

function matchesFilter(e){
  if(state.calendarDrillDate) return e.date === state.calendarDrillDate;
  if(state.filterTitle && !(e.title||'').toLowerCase().includes(state.filterTitle.toLowerCase())) return false;
  if(state.filterCats.size>0 && !state.filterCats.has(e.category)) return false;
  if(state.filterFrom && e.date < state.filterFrom) return false;
  if(state.filterTo && e.date > state.filterTo) return false;
  return true;
}
function filteredEntries(){
  return entries.filter(matchesFilter).sort((a,b)=> b.date.localeCompare(a.date) || b.createdAt-a.createdAt);
}
/* Lista y Mosaico solo muestran, por defecto, el mes elegido en su propio
   selector (independiente del de Calendario), para no renderizar listas
   cada vez más largas. Los filtros (categoría, título, fechas) siguen
   aplicándose sobre TODA la base de datos: en cuanto el usuario fija un
   rango de fechas explícito (o llega desde un día del calendario con varias
   entradas) se ignora la restricción de mes y se muestra el rango completo. */
function hasExplicitDateFilter(){
  return !!(state.filterFrom || state.filterTo || state.calendarDrillDate);
}
function listMosaicEntries(){
  let list = filteredEntries();
  if(!hasExplicitDateFilter()){
    list = list.filter(e=>{ const d=fmtDate(e.date); return d.y===state.listYear && d.m===state.listMonth; });
  }
  return list;
}
function monthNavHTML(){
  if(hasExplicitDateFilter()){
    return `<div class="empty-hint" style="padding:0 0 18px 0;">Mostrando el rango de fechas filtrado (no solo un mes).</div>`;
  }
  return `<div class="cal-header" id="entryMonthNav" style="margin-bottom:18px;">
    <div class="cal-nav" id="entryMonthPrev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></div>
    <div class="month-label">${MONTHS[state.listMonth]} ${state.listYear}</div>
    <div class="cal-nav" id="entryMonthNext"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></div>
  </div>`;
}
function bindMonthNavEvents(){
  const prev = document.getElementById('entryMonthPrev');
  const next = document.getElementById('entryMonthNext');
  if(prev) prev.addEventListener('click', ()=>{ state.listMonth--; if(state.listMonth<0){state.listMonth=11; state.listYear--;} renderView(); });
  if(next) next.addEventListener('click', ()=>{ state.listMonth++; if(state.listMonth>11){state.listMonth=0; state.listYear++;} renderView(); });
}

/* ---------- Render: barra de filtros ---------- */
function updateFilterCountBadge(){
  const countBadge = document.getElementById('filterCount');
  const activeCount = state.filterCats.size + (state.filterFrom?1:0) + (state.filterTo?1:0) + (state.filterTitle?1:0) + (state.calendarDrillDate?1:0);

function updateFilterTotalBox(){

}
function renderFilterbar(){
  const bar = document.getElementById('filterbar');
  const toggle = document.getElementById('filterToggle');

  if(state.view === 'stats'){
    bar.classList.remove('open'); bar.style.display='none'; toggle.style.display='none';

  }
  bar.style.display='';

  updateFilterCountBadge();

  let html = `<div class="filter-title-row">
    <input type="text" id="filterTitle" placeholder="Buscar por título..." value="${escapeHTML(state.filterTitle)}">
  </div>
  <div class="cat-tile-grid">`;
  CAT_KEYS.forEach(k=>{
    const active = state.filterCats.has(k);
    html += `<div class="cat-tile ${active?'active':''}" style="--c:var(--cat-${k})" data-cat="${k}">
      <div class="ic">${ICONS[k]}</div><span>${CATEGORIES[k].label}</span>
    </div>`;
  });
  html += `</div>
  <div class="filter-dates-row">
    <div class="filter-dates">
      Desde <input type="date" id="filterFrom" value="${state.filterFrom}">
      Hasta <input type="date" id="filterTo" value="${state.filterTo}">
    </div>
  </div>
  <div class="filter-bottom-row">
    <div class="filter-total-box"><b id="filterTotalCount">${filteredEntries().length}</b><span>entradas</span></div>
    <button class="clear-filters" id="clearFilters"><span>Limpiar</span><span>filtros</span></button>
  </div>`;
  bar.innerHTML = html;

  document.getElementById('filterTitle').addEventListener('input', e=>{
    state.filterTitle = e.target.value;
    state.calendarDrillDate = null;
    updateFilterCountBadge();
    renderView();
  });
  bar.querySelectorAll('.cat-tile').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const k = chip.dataset.cat;
      state.filterCats.has(k) ? state.filterCats.delete(k) : state.filterCats.add(k);
      state.calendarDrillDate = null;
      renderFilterbar(); renderView();
    });
  });
  document.getElementById('filterFrom').addEventListener('change', e=>{ state.filterFrom = e.target.value; state.calendarDrillDate=null; renderFilterbar(); renderView(); });
  document.getElementById('filterTo').addEventListener('change', e=>{ state.filterTo = e.target.value; state.calendarDrillDate=null; renderFilterbar(); renderView(); });
  document.getElementById('clearFilters').addEventListener('click', ()=>{
    state.filterCats.clear(); state.filterFrom=''; state.filterTo=''; state.filterTitle=''; state.calendarDrillDate=null;
    renderFilterbar(); renderView();
  });
}
document.getElementById('filterToggle').addEventListener('click', ()=>{
  state.filterOpen = !state.filterOpen;
  renderFilterbar();
});

function escapeHTML(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function emptyState(){
  return `<div class="empty-state">

/* ---------- Render: vista Calendario ---------- */
function renderCalendario(){
  const y = state.calYear, m = state.calMonth;
  const first = new Date(y,m,1);
  const startDow = (first.getDay()+6)%7; // lunes=0
  const daysInMonth = new Date(y,m+1,0).getDate();
  const list = entries.filter(matchesFilter);
  const byDay = {};
  list.forEach(e=>{
    const d = fmtDate(e.date);
    if(d.y===y && d.m===m){ (byDay[d.day] = byDay[d.day]||[]).push(e); }
  });

  let html = `<div class="cal-header">
    <div class="cal-nav" id="calPrev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></div>
    <div class="month-label">${MONTHS[m]} ${y}</div>
    <div class="cal-nav" id="calNext"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></div>
  </div>
  <div class="cal-grid">`;
  DOW.forEach(d=> html += `<div class="cal-dow">${d}</div>`);
  for(let i=0;i<startDow;i++) html += `<div class="cal-day empty"></div>`;
  const todayD = fmtDate(todayStr());
  for(let day=1; day<=daysInMonth; day++){
    const dayEntries = byDay[day]||[];
    const isToday = todayD.y===y && todayD.m===m && todayD.day===day;
    html += `<div class="cal-day ${isToday?'today':''}" data-day="${day}">
      <div class="cal-day-num">${day}</div>
      <div class="cal-icons">`;
    dayEntries.slice(0,8).forEach(e=>{ html += `<span class="cal-icon" style="--c:var(--cat-${e.category})" title="${escapeHTML(e.title)}">${ICONS[e.category]}</span>`; });
    html += `</div>${dayEntries.length>8?`<div class="cal-more">+${dayEntries.length-8}</div>`:''}</div>`;
  }
  html += '</div>';
  return html;
}

/* ---------- Render: vista Mosaico ---------- */
function renderMosaico(){
  const nav = monthNavHTML();
  const list = listMosaicEntries();
  if(list.length===0) return nav + emptyState();
  const groups = {};

  order.forEach(date=>{
    const d = fmtDate(date);

      <div class="mosaic-day-label">${d.day} de ${MONTHS[d.m]} de ${d.y}</div>

      <button data-mode="historico" class="${state.statsMode==='historico'?'active':''}">Histórico</button>
    </div>`;
  if(state.statsMode!=='historico'){
    controls += `<div class="stats-period-row">`;
    if(state.statsMode==='mes'){
      controls += `<select class="stats-select" id="statsMonth" style="grid-column:1;">${MONTHS.map((mn,i)=>`<option value="${i}" ${i===state.statsMonth?'selected':''}>${mn}</option>`).join('')}</select>`;
    }
    controls += `<select class="stats-select" id="statsYear" style="grid-column:2;">${years.map(y=>`<option value="${y}" ${y===state.statsYear?'selected':''}>${y}</option>`).join('')}</select>`;
    controls += `<span class="stats-total" id="statsTotalSlot"></span>`;
    controls += `</div>`;
  } else {
    controls += `<span class="stats-total">${entries.length} entradas</span>`;
  }
  controls += `</div>`;

  if(state.statsMode==='historico'){
    return controls + categoryBarsHTML(entries) + '<div style="margin-top:28px;">' + renderHistoryChart() + '</div>';
  }

  let periodEntries;
  if(state.statsMode==='mes'){
    periodEntries = entries.filter(e=>{ const d=fmtDate(e.date); return d.y===state.statsYear && d.m===state.statsMonth; });
  } else {
    periodEntries = entries.filter(e=> fmtDate(e.date).y===state.statsYear);
  }
  const bars = categoryBarsHTML(periodEntries);

  let breakdown = '';
  if(state.statsMode==='anio'){
    const perMonth = Array.from({length:12}, ()=>({}));
    entries.filter(e=>fmtDate(e.date).y===state.statsYear).forEach(e=>{
      const mIdx = fmtDate(e.date).m;
      perMonth[mIdx][e.category] = (perMonth[mIdx][e.category]||0)+1;
    });
    const monthTotals = perMonth.map(o=> Object.values(o).reduce((a,b)=>a+b,0));
    const maxMonth = Math.max(1, ...monthTotals);
    breakdown = `<div class="month-breakdown">
      <div class="section-title">Desglose mensual</div>`;
    for(let i=0;i<12;i++){
      const total = monthTotals[i];
      let segs = '';
      if(total>0){
        CAT_KEYS.forEach(k=>{
          const v = perMonth[i][k]||0;
          if(v>0) segs += `<div class="mb-seg" style="background:var(--cat-${k}); flex:${v} 1 0;" title="${CATEGORIES[k].label}: ${v}">${v}</div>`;
        });
      }
      breakdown += `<div class="mb-row">
        <div class="mb-label">${MONTHS_SHORT[i]}</div>
        <div class="mb-stack">${total>0 ? `<div style="display:flex; width:${(total/maxMonth*100)}%; height:100%;">${segs}</div>` : ''}</div>
        <div class="mb-total">${total}</div>
      </div>`;
    }
    breakdown += '</div>';
  }

  const totalCount = periodEntries.length;
  return controls.replace('<span class="stats-total" id="statsTotalSlot"></span>', `<span class="stats-total">${totalCount} entradas</span>`) + bars + breakdown;
}

/* ---------- Gráfica de histórico anual (líneas por categoría) ---------- */
function renderHistoryChart(){
  if(!entries.length) return '<p class="empty-hint">Todavía no hay entradas para mostrar un histórico.</p>';
  const years = Array.from(new Set(entries.map(e=>fmtDate(e.date).y))).sort((a,b)=>a-b);
  if(!years.length) return '<p class="empty-hint">Todavía no hay entradas para mostrar un histórico.</p>';
  const perYear = {};
  years.forEach(y=>{ perYear[y]={}; CAT_KEYS.forEach(k=> perYear[y][k]=0); });
  entries.forEach(e=>{
    const y = fmtDate(e.date).y;
    if(perYear[y]) perYear[y][e.category] = (perYear[y][e.category]||0) + 1;
  });
  let maxVal = 1;
  years.forEach(y=> CAT_KEYS.forEach(k=>{ maxVal = Math.max(maxVal, perYear[y][k]); }));

  // Escala en raíz cuadrada: en lineal, una categoría muy numerosa (p.ej.
  // Juego) aplasta contra el eje X a las demás, que quedan apelotonadas
  // abajo. Con la raíz cuadrada las categorías pequeñas ganan separación
  // vertical entre sí sin dejar de reflejar que unas superan a otras.
  const scaleMax = Math.sqrt(maxVal);

  const W = Math.max(640, years.length*110), H = 300;
  const padL=38, padR=14, padT=18, padB=28;
  const chartW = W-padL-padR, chartH = H-padT-padB;
  const xStep = years.length>1 ? chartW/(years.length-1) : 0;
  const xFor = i => padL + (years.length>1 ? i*xStep : chartW/2);
  const yFor = v => padT + chartH - (Math.sqrt(v)/scaleMax*chartH);

  let grid = '';
  const ySteps = Math.min(6, maxVal);
  for(let s=0;s<=ySteps;s++){
    const frac = s/ySteps;
    const v = Math.round(Math.pow(frac*scaleMax, 2));
    const y = yFor(v);
    grid += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;
    grid += `<text x="${padL-8}" y="${y+4}" font-size="11" text-anchor="end" fill="var(--ink-soft)" font-family="monospace">${v}</text>`;
  }
  let xLabels = '';
  years.forEach((y,i)=>{
    xLabels += `<text x="${xFor(i)}" y="${H-8}" font-size="11" text-anchor="middle" fill="var(--ink-soft)" font-family="monospace">${y}</text>`;
  });
  let lines = '';
  CAT_KEYS.forEach(k=>{
    const pts = years.map((y,i)=> `${xFor(i)},${yFor(perYear[y][k])}`).join(' ');
    lines += `<polyline points="${pts}" fill="none" stroke="var(--cat-${k})" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    years.forEach((y,i)=>{ lines += `<circle cx="${xFor(i)}" cy="${yFor(perYear[y][k])}" r="3.2" fill="var(--cat-${k})"/>`; });
  });
  let legend = '<div class="history-legend">';
  CAT_KEYS.forEach(k=>{ legend += `<div class="history-legend-item" style="--c:var(--cat-${k})">${ICONS[k]}<span>${CATEGORIES[k].label}</span></div>`; });
  legend += '</div>';

  return `<div class="history-chart">
    <svg viewBox="0 0 ${W} ${H}" class="history-svg" preserveAspectRatio="xMidYMid meet">${grid}${lines}${xLabels}</svg>
    ${legend}
  </div>`;
}

const titleInput = document.getElementById('f-title');
const suggestionsEl = document.getElementById('titleSuggestions');
function hideTitleSuggestions(){ suggestionsEl.style.display='none'; suggestionsEl.innerHTML=''; }
function updateTitleSuggestions(){
  const q = titleInput.value.trim().toLowerCase();
  if(q.length<2){ hideTitleSuggestions(); return; }
  const seen = new Set();
  const matches = [];
  for(let i=entries.length-1; i>=0; i--){ // las más recientes primero
    const e = entries[i];
    if(state.editingId && e.id===state.editingId) continue;
    if(e.title && e.title.toLowerCase().includes(q) && !seen.has(e.title.toLowerCase())){
      seen.add(e.title.toLowerCase());
      matches.push(e);
      if(matches.length>=6) break;
    }
  }
  if(!matches.length){ hideTitleSuggestions(); return; }
  suggestionsEl.innerHTML = matches.map(m=>`
    <div class="title-suggestion" data-id="${m.id}">
      <span class="ts-icon" style="--c:var(--cat-${m.category})">${ICONS[m.category]}</span>
      <span class="ts-title">${escapeHTML(m.title)}</span>
    </div>`).join('');
  suggestionsEl.style.display='block';
  suggestionsEl.querySelectorAll('.title-suggestion').forEach(el=>{
    el.addEventListener('mousedown', (ev)=>{ // mousedown para adelantarse al blur del input
      ev.preventDefault();
      const match = entries.find(e=>e.id===el.dataset.id);
      if(!match) return;
      titleInput.value = match.title;
      buildCatSelect(match.category);
      document.getElementById('f-date').value = todayStr();
      if(match.image){
        state.tempImage = match.image;
        const preview = document.getElementById('imgPreview');
        preview.onerror=null; preview.onload=null;
        preview.src = match.image; preview.style.display='block';
        document.getElementById('removeImg').style.display='inline-block';
        pasteZoneText.style.display='none';
      }
      hideTitleSuggestions();
    });
  });
}

function compressImage(dataUrl){
  return new Promise((resolve)=>{
    if(!dataUrl || !dataUrl.startsWith('data:image')){ resolve(dataUrl); return; }
    const img = new Image();
    img.onload = ()=>{
      const MAX_DIM = 1280;
      let {width, height} = img;
      if(width>MAX_DIM || height>MAX_DIM){
        if(width>height){ height = Math.round(height*MAX_DIM/width); width = MAX_DIM; }
        else { width = Math.round(width*MAX_DIM/height); height = MAX_DIM; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,width,height); // fondo blanco por si hay transparencia
      ctx.drawImage(img, 0, 0, width, height);
      try{ resolve(canvas.toDataURL('image/jpeg', 0.82)); }
      catch(e){ resolve(dataUrl); } // p.ej. imagen de otro origen sin CORS: nos quedamos con el original
    };
    img.onerror = ()=> resolve(dataUrl);
    img.src = dataUrl;
  });
}
async function showImagePreview(src){
  const compressed = await compressImage(src);
  state.tempImage = compressed;
  const preview = document.getElementById('imgPreview');
  preview.onerror = ()=>{ preview.style.display='none'; };
  preview.onload = ()=>{ preview.style.display='block'; };
  preview.src = compressed;
  pasteZoneText.style.display = 'none';
  document.getElementById('removeImg').style.display='inline-block';
}

function extractImageFromClipboard(cd){
  return new Promise((resolve)=>{
    const items = cd && cd.items;
    if(items){
      for(let i=0; i<items.length; i++){
        if(items[i].type.indexOf('image') !== -1){
          const file = items[i].getAsFile();
          const reader = new FileReader();
          reader.onload = ()=> resolve(reader.result);
          reader.readAsDataURL(file);
          return;
        }
      }
    }
    const html = cd && cd.getData ? cd.getData('text/html') : '';
    const match = html && html.match(/<img[^>]+src=["']([^"']+)["']/i);
    if(match){ resolve(match[1]); return; }
    resolve(null);
  });
}
function resetPasteZoneUI(){
  const preview = document.getElementById('imgPreview');
  pasteZoneText.innerHTML = PASTE_ZONE_PLACEHOLDER_HTML;
  pasteZone.innerHTML = '';
  pasteZone.appendChild(pasteZoneText);
  pasteZone.appendChild(preview);
}
function blobUrlToDataUrl(url){
  return fetch(url).then(r=>r.blob()).then(blob=> new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result);
    reader.onerror = ()=> resolve(null);
    reader.readAsDataURL(blob);
  }));
}
function useFoundImage(rawSrc){
  if(rawSrc.startsWith('blob:')){
    blobUrlToDataUrl(rawSrc).then(dataUrl=>{
      if(dataUrl) showImagePreview(dataUrl);
      resetPasteZoneUI();
    });
  } else {
    showImagePreview(rawSrc);
    resetPasteZoneUI();
  }
}
function handlePaste(e){
  if(!overlay.classList.contains('open')) return;
  const cd = e.clipboardData || window.clipboardData;
  extractImageFromClipboard(cd).then(src=>{
    if(src){ useFoundImage(src); }
    // Si no hay imagen en el evento, no hacemos nada aquí: dejamos que el
    // navegador la inserte él mismo en el cuadro, y el evento "input" (más
    // abajo) la recoge en cuanto el contenido cambie de verdad.
  });
}
pasteZone.addEventListener('click', ()=> pasteZone.focus());
pasteZone.addEventListener('paste', handlePaste);
document.addEventListener('paste', handlePaste);

pasteZone.addEventListener('input', ()=>{
  const img = pasteZone.querySelector('img:not(#imgPreview)');
  if(img && img.src){
    useFoundImage(img.src);
  } else if(pasteZone.textContent.trim() !== pasteZoneText.textContent.trim()){
    // Se pegó o escribió texto sin imagen real: limpiamos para no dejar restos.
    resetPasteZoneUI();
  }
});

/* ---------- Copia de seguridad (exportar / importar JSON propio) ---------- */
function exportBackup(){
  const data = {
    app: 'Hyggelog', exportedAt: new Date().toISOString(), count: entries.length,
    entries: entries.map(e=>({
      id:e.id, title:e.title, notes:e.notes, date:e.date, category:e.category,
      image:e.image, createdAt:e.createdAt, updatedAt:e.updatedAt
    }))
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `hyggelog-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function isValidHyggelogBackup(data){
  return !!data && data.app === 'Hyggelog' && Array.isArray(data.entries);
}
async function importBackupData(data){
  if(!isValidHyggelogBackup(data)){
    alert('Este archivo no es una copia de seguridad de Hyggelog válida. Solo se pueden importar archivos .json exportados desde este mismo botón.');
    return;
  }
  let added = 0, skipped = 0, invalid = 0;
  const existingIds = new Set(entries.map(e=>e.id));
  const toPush = [];
  data.entries.forEach(item=>{
    if(!item || !item.id || !item.title || !item.date || !item.category){ invalid++; return; }
    if(existingIds.has(item.id)){ skipped++; return; }
    const restored = {
      id:item.id, title:item.title, notes:item.notes||'', date:item.date, category:item.category,
      image:item.image||null, createdAt:item.createdAt||Date.now(),
      updatedAt: new Date().toISOString(), synced:false
    };
    entries.push(restored);
    existingIds.add(item.id);
    toPush.push(restored);
    added++;
  });
  if(added>0){
    saveEntries();
    renderFilterbar(); renderView();
    for(const entry of toPush){ await pushEntryToCloud(entry); }
    const code = localStorage.getItem(SYNC_CODE_KEY);
    if(code) await touchDiaryMarker(code);
  }
  let msg = `Importación completada: ${added} entradas nuevas añadidas.`;
  if(skipped>0) msg += ` ${skipped} ya existían y se han omitido.`;
  if(invalid>0) msg += ` ${invalid} filas del archivo no tenían el formato esperado y se han ignorado.`;
  alert(msg);
}

  syncOverlay.classList.add('open');
});
document.getElementById('closeSyncModal').addEventListener('click', ()=> syncOverlay.classList.remove('open'));
syncOverlay.addEventListener('click', e=>{ if(e.target===syncOverlay) syncOverlay.classList.remove('open'); });
document.getElementById('connectSyncBtn').addEventListener('click', ()=>{
  connectSync(document.getElementById('syncCodeInput').value);
});
document.getElementById('pullSyncBtn').addEventListener('click', manualPull);

/* ---------- Inicio ---------- */
renderFilterbar();
renderView();
(function autoSyncOnLoad(){
  const code = localStorage.getItem(SYNC_CODE_KEY);
  if(!code) return;
  silentPull();
  startSyncPolling();
})();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
